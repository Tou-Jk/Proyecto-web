<main>
  <div
    class="container"
    style="
      min-height: 50vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 160px 20px 80px;
      background: linear-gradient(180deg, #f5f5f5 0%, #ffffff 100%);
    "
  >
    <div
      style="
        max-width: 760px;
        width: 100%;
        background: #fff;
        border: 1px solid #e6e6e6;
        border-radius: 18px;
        box-shadow: 0 20px 40px rgba(8, 17, 48, 0.08);
        padding: 40px 30px;
      "
    >
      <p
        style="
          text-transform: uppercase;
          letter-spacing: 0.12em;
          color: #f8ad00;
          font-weight: 700;
          font-size: 12px;
          margin-bottom: 16px;
        "
      >
        Contáctanos
      </p>
      <h1
        style="
          font-size: clamp(2rem, 5vw, 3rem);
          color: #081130;
          margin-bottom: 16px;
        "
      >
        Hablemos de tu proyecto
      </h1>
      <p
        style="
          font-size: 1.05rem;
          color: #2a2a2a;
          margin-bottom: 26px;
          line-height: 1.7;
        "
      >
        Somos especialistas en soluciones eléctricas para proyectos
        residenciales, industriales y comerciales. Envíanos tus datos y te
        responderemos a la brevedad.
      </p>
      <form style="display: grid; gap: 18px">
        <div
          style="
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
          "
        >
          <input
            type="text"
            placeholder="Nombres y apellidos"
            style="
              padding: 14px 16px;
              border: 1px solid #d9d9d9;
              border-radius: 12px;
              font: inherit;
            "
          />
          <input
            type="email"
            placeholder="Correo electrónico"
            style="
              padding: 14px 16px;
              border: 1px solid #d9d9d9;
              border-radius: 12px;
              font: inherit;
            "
          />
        </div>
        <div
          style="
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
          "
        >
          <input
            type="tel"
            placeholder="Teléfono"
            style="
              padding: 14px 16px;
              border: 1px solid #d9d9d9;
              border-radius: 12px;
              font: inherit;
            "
          />
          <input
            type="text"
            placeholder="Empresa o proyecto"
            style="
              padding: 14px 16px;
              border: 1px solid #d9d9d9;
              border-radius: 12px;
              font: inherit;
            "
          />
        </div>
        <textarea
          rows="5"
          placeholder="Mensaje"
          style="
            padding: 14px 16px;
            border: 1px solid #d9d9d9;
            border-radius: 12px;
            resize: vertical;
            font: inherit;
          "
        ></textarea>
        <button
          type="submit"
          class="boton"
          style="border: none; cursor: pointer"
        >
          Enviar mensaje
        </button>
      </form>
    </div>
  </div>
</main>
